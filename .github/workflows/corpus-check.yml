name: Corpus Check

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: Corpus gate to run
        required: true
        default: aom
        type: choice
        options:
          - aom
          - argon
          - firefox
          - chromium
          - browser
          - all

permissions:
  contents: read

jobs:
  firefox-corpus:
    if: ${{ inputs.corpus == 'firefox' || inputs.corpus == 'browser' || inputs.corpus == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore pinned Firefox AVIF resources
        uses: actions/cache@v5
        with:
          path: build/firefox-avif-test-resources
          key: firefox-avif-ac91bfcce1bf3240e2dce40f47c372e76bc4f26c
      - name: Run Firefox AVIF compatibility gate
        run: >-
          ./gradlew -g .gradle-user-home
          firefoxAvifTest --info --no-daemon --stacktrace

  chromium-corpus:
    if: ${{ inputs.corpus == 'chromium' || inputs.corpus == 'browser' || inputs.corpus == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore pinned Chromium AVIF resources
        uses: actions/cache@v5
        with:
          path: build/chromium-avif-test-resources
          key: chromium-avif-ddb449c8c2536723346df7ea26ca13d99857c302
      - name: Run Chromium AVIF compatibility gate
        run: >-
          ./gradlew -g .gradle-user-home
          chromiumAvifTest --info --no-daemon --stacktrace

  aom-corpus:
    if: ${{ inputs.corpus == 'aom' || inputs.corpus == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore pinned AOMedia corpus archive
        uses: actions/cache@v5
        with:
          path: build/downloads/av1-avif-bf4c18d1f3971069b75e87d6ee469790589f4f09.zip
          key: aom-avif-bf4c18d1f3971069b75e87d6ee469790589f4f09
      - name: Run AOMedia AVIF corpus gate
        run: >-
          xvfb-run -a ./gradlew -g .gradle-user-home
          aomAvifTest --info --no-daemon --stacktrace

  argon-corpus:
    if: ${{ inputs.corpus == 'argon' || inputs.corpus == 'all' }}
    name: Argon (${{ matrix.category }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        category:
          - profile0_not_annexb
          - profile0_not_annexb_special
          - profile0_error
          - profile0_core
          - profile0_core_special
          - profile0_large_scale_tile
          - profile0_large_scale_tile_special
          - profile1_not_annexb
          - profile1_not_annexb_special
          - profile1_error
          - profile1_core
          - profile1_core_special
          - profile1_large_scale_tile
          - profile1_large_scale_tile_special
          - profile2_not_annexb
          - profile2_not_annexb_special
          - profile2_error
          - profile2_core
          - profile2_core_special
          - profile2_large_scale_tile
          - profile2_large_scale_tile_special
          - profile_switching
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore pinned Argon Streams archive
        uses: actions/cache@v5
        with:
          path: build/downloads/argon_coveragetool_av1_base_and_extended_profiles_v2.1.1.zip
          key: argon-av1-v2.1.1
      - name: Run Argon Streams AV1 corpus gate
        run: >-
          ./gradlew -g .gradle-user-home
          argonAv1Test -PargonAv1Case=${{ matrix.category }}/all
          --info --no-daemon --stacktrace

  argon-extended:
    if: ${{ inputs.corpus == 'argon' || inputs.corpus == 'all' }}
    name: Argon extended (${{ matrix.category }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        category:
          - profile0_not_annexb
          - profile1_not_annexb
          - profile2_not_annexb
          - profile_switching
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore pinned Argon Streams archive
        uses: actions/cache@v5
        with:
          path: build/downloads/argon_coveragetool_av1_base_and_extended_profiles_v2.1.1.zip
          key: argon-av1-v2.1.1
      - name: Run Argon operating-point and film-grain gate
        run: >-
          ./gradlew -g .gradle-user-home
          argonAv1Test -PargonAv1Case=${{ matrix.category }}/all
          -PargonAv1OperatingPoint=distinct -PargonAv1Output=both
          --info --no-daemon --stacktrace

  argon-extended-special:
    if: ${{ inputs.corpus == 'argon' || inputs.corpus == 'all' }}
    name: Argon extended (${{ matrix.category }}, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        category:
          - profile0_not_annexb_special
          - profile0_core_special
          - profile1_not_annexb_special
          - profile1_core_special
          - profile2_not_annexb_special
          - profile2_core_special
        shard:
          - '1/2'
          - '2/2'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore pinned Argon Streams archive
        uses: actions/cache@v5
        with:
          path: build/downloads/argon_coveragetool_av1_base_and_extended_profiles_v2.1.1.zip
          key: argon-av1-v2.1.1
      - name: Run sharded Argon special operating-point and film-grain gate
        run: >-
          ./gradlew -g .gradle-user-home
          argonAv1Test -PargonAv1Case=${{ matrix.category }}/all
          -PargonAv1Shard=${{ matrix.shard }}
          -PargonAv1OperatingPoint=distinct -PargonAv1Output=both
          --info --no-daemon --stacktrace

  argon-extended-core:
    if: ${{ inputs.corpus == 'argon' || inputs.corpus == 'all' }}
    name: Argon extended (${{ matrix.category }}, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        category:
          - profile0_core
          - profile1_core
          - profile2_core
        shard:
          - '1/4'
          - '2/4'
          - '3/4'
          - '4/4'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore pinned Argon Streams archive
        uses: actions/cache@v5
        with:
          path: build/downloads/argon_coveragetool_av1_base_and_extended_profiles_v2.1.1.zip
          key: argon-av1-v2.1.1
      - name: Run sharded Argon operating-point and film-grain gate
        run: >-
          ./gradlew -g .gradle-user-home
          argonAv1Test -PargonAv1Case=${{ matrix.category }}/all
          -PargonAv1Shard=${{ matrix.shard }}
          -PargonAv1OperatingPoint=distinct -PargonAv1Output=both
          --info --no-daemon --stacktrace

  argon-stress:
    if: ${{ inputs.corpus == 'argon' || inputs.corpus == 'all' }}
    name: Argon stress (${{ matrix.category }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        category:
          - profile0_stress
          - profile1_stress
          - profile2_stress
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore pinned Argon Streams archive
        uses: actions/cache@v5
        with:
          path: build/downloads/argon_coveragetool_av1_base_and_extended_profiles_v2.1.1.zip
          key: argon-av1-v2.1.1
      - name: Run Argon Streams AV1 stress gate
        run: >-
          ./gradlew -g .gradle-user-home
          argonAv1Test -PargonAv1Case=${{ matrix.category }}/all
          --info --no-daemon --stacktrace

  argon-extended-stress:
    if: ${{ inputs.corpus == 'argon' || inputs.corpus == 'all' }}
    name: Argon film grain stress (${{ matrix.category }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        category:
          - profile0_stress
          - profile1_stress
          - profile2_stress
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore pinned Argon Streams archive
        uses: actions/cache@v5
        with:
          path: build/downloads/argon_coveragetool_av1_base_and_extended_profiles_v2.1.1.zip
          key: argon-av1-v2.1.1
      - name: Run Argon film-grain stress gate
        run: >-
          ./gradlew -g .gradle-user-home
          argonAv1Test -PargonAv1Case=${{ matrix.category }}/all
          -PargonAv1Output=film-grain
          --info --no-daemon --stacktrace
