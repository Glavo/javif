name: Gradle Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gradle-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Test on Java 17
        run: >-
          xvfb-run -a ./gradlew -g .gradle-user-home
          cleanTest test verifyNoRuntimeDependencies
          --info --no-daemon --stacktrace
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build and verify documentation on Java 25
        run: >-
          xvfb-run -a ./gradlew -g .gradle-user-home
          clean assemble javadoc verifyNoRuntimeDependencies
          --info --no-daemon --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: javif.jar
          path: build/libs/*.jar
